<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GS MUSIC - 3D VFX & Advanced Player</title>
    <style>
        :root {
            --bg-base: #050508;
            --bg-surface: #121218;
            --bg-elevated: #1e1e28;
            --primary: #00f3ff;
            --secondary: #ff0055;
            --purple: #9d00ff;
            --text-main: #ffffff;
            --text-sub: #a0a0c0;
            --sidebar-width: 240px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* 3D Background Canvas VFX */
        #vfx-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        /* Glassmorphism Sidebar */
        .sidebar {
            width: var(--sidebar-width);
            background: rgba(10, 10, 18, 0.7);
            backdrop-filter: blur(20px);
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            z-index: 10;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(45deg, var(--secondary), var(--purple), var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            padding-left: 8px;
            animation: pulse-glow 3s infinite alternate;
        }

        @keyframes pulse-glow {
            0% { filter: drop-shadow(0 0 5px rgba(255, 0, 85, 0.6)); }
            100% { filter: drop-shadow(0 0 15px rgba(0, 243, 255, 0.8)); }
        }

        .nav-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .nav-item {
            color: var(--text-sub);
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            padding: 10px 12px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.3s;
        }

        .nav-item:hover, .nav-item.active {
            color: var(--text-main);
            background: rgba(0, 243, 255, 0.1);
            border-left: 3px solid var(--primary);
        }

        /* Main View */
        .main-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px 32px 130px 32px;
            position: relative;
            z-index: 1;
        }

        .search-bar input {
            width: 400px;
            padding: 12px 20px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            color: white;
            outline: none;
            font-size: 0.95rem;
            backdrop-filter: blur(10px);
            transition: 0.3s;
        }

        .search-bar input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
        }

        .section-title {
            font-size: 1.6rem;
            font-weight: 800;
            margin: 24px 0 16px 0;
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.3);
        }

        /* 3D VFX Track Cards Grid */
        .track-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .card {
            background: rgba(20, 20, 30, 0.6);
            border-radius: 16px;
            padding: 14px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            transform-style: preserve-3d;
            perspective: 1000px;
        }

        .card:hover {
            transform: translateY(-8px) rotateX(4deg) rotateY(-4deg);
            border-color: var(--primary);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.8), 0 0 20px rgba(0, 243, 255, 0.25);
        }

        .card img {
            width: 100%;
            aspect-ratio: 16/9;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 10px;
        }

        .card-title {
            font-weight: 700;
            font-size: 0.95rem;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-artist {
            font-size: 0.8rem;
            color: var(--text-sub);
            margin-bottom: 12px;
        }

        .card-actions {
            display: flex;
            gap: 8px;
        }

        .btn-action {
            flex: 1;
            padding: 6px;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.75rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-play {
            background: linear-gradient(45deg, var(--primary), var(--purple));
            color: #fff;
        }

        .btn-dl {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* Advanced Player Dock Bar */
        .player-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100vw;
            height: 105px;
            background: rgba(5, 5, 12, 0.92);
            backdrop-filter: blur(25px);
            border-top: 1px solid rgba(255, 255, 255, 0.12);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 28px;
            z-index: 1000;
            box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.9);
        }

        .now-playing {
            display: flex;
            align-items: center;
            gap: 14px;
            width: 25%;
        }

        .now-playing img {
            width: 60px;
            height: 60px;
            border-radius: 10px;
            object-fit: cover;
            border: 2px solid var(--primary);
            box-shadow: 0 0 12px rgba(0, 243, 255, 0.4);
        }

        .player-controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            width: 45%;
        }

        .control-btns {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .ctrl-btn {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .ctrl-btn:hover {
            transform: scale(1.1);
            background: rgba(255, 255, 255, 0.2);
        }

        .play-main-btn {
            width: 44px;
            height: 44px;
            background: linear-gradient(45deg, var(--primary), var(--purple));
            color: #fff;
            font-size: 1.1rem;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.5);
        }

        .stop-main-btn {
            background: var(--secondary);
            color: #fff;
        }

        /* Interactive Timeline Seek Bar */
        .timeline-container {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.75rem;
            color: var(--text-sub);
        }

        .seek-bar {
            flex: 1;
            -webkit-appearance: none;
            height: 5px;
            border-radius: 5px;
            background: #2a2a38;
            outline: none;
            cursor: pointer;
            transition: height 0.2s;
        }

        .seek-bar::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--primary);
            box-shadow: 0 0 10px var(--primary);
            cursor: pointer;
        }

        /* Audio Visualizer Bars */
        .vfx-bars {
            display: flex;
            align-items: center;
            gap: 4px;
            height: 25px;
            width: 15%;
            justify-content: flex-end;
        }

        .vbar {
            width: 4px;
            background: var(--primary);
            height: 6px;
            border-radius: 2px;
            animation: barPulse 0.8s infinite ease-in-out alternate;
        }

        @keyframes barPulse {
            0% { height: 6px; background: var(--primary); }
            100% { height: 26px; background: var(--secondary); box-shadow: 0 0 8px var(--secondary); }
        }

        #youtube-player-container {
            display: none;
        }
    </style>
</head>
<body>

    <!-- 3D VFX Particle Space Background -->
    <canvas id="vfx-canvas"></canvas>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="logo">GS MUSIC</div>
        <ul class="nav-list">
            <li class="nav-item active">🏠 Home</li>
            <li class="nav-item">🔍 Search</li>
            <li class="nav-item">📚 Library</li>
            <li class="nav-item">🔥 Playlists</li>
        </ul>
    </div>

    <!-- Main Workspace -->
    <div class="main-container">
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Search YouTube songs, artists..." onkeypress="handleSearchKey(event)">
        </div>

        <h2 class="section-title">Trending YouTube Hits</h2>
        <div class="track-grid" id="trackGrid"></div>
    </div>

    <!-- Hidden YouTube API Engine -->
    <div id="youtube-player-container">
        <div id="yt-player"></div>
    </div>

    <!-- Bottom Player Control Dock Bar -->
    <div class="player-bar">
        <div class="now-playing">
            <img id="playerThumb" src="https://via.placeholder.com/60/121218/00f3ff?text=GS" alt="Art">
            <div style="overflow: hidden;">
                <div id="playerTitle" style="font-weight: 700; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Select track</div>
                <div id="playerArtist" style="font-size: 0.8rem; color: var(--text-sub);">GS Player Engine</div>
            </div>
        </div>

        <div class="player-controls">
            <div class="control-btns">
                <button class="ctrl-btn" onclick="seekRelative(-10)" title="Rewind 10s">⏪</button>
                <button class="ctrl-btn play-main-btn" id="playPauseBtn" onclick="togglePlayPause()" title="Play/Pause">▶</button>
                <button class="ctrl-btn stop-main-btn" onclick="stopMusic()" title="Stop">⏹</button>
                <button class="ctrl-btn" onclick="seekRelative(10)" title="Forward 10s">⏩</button>
            </div>

            <!-- Music Timeline / Seek Bar -->
            <div class="timeline-container">
                <span id="currTime">0:00</span>
                <input type="range" id="seekBar" class="seek-bar" value="0" min="0" max="100" oninput="onSeekChange(this.value)">
                <span id="totalTime">0:00</span>
            </div>
        </div>

        <div class="vfx-bars">
            <div class="vbar" style="animation-delay: 0.1s"></div>
            <div class="vbar" style="animation-delay: 0.3s"></div>
            <div class="vbar" style="animation-delay: 0.2s"></div>
            <div class="vbar" style="animation-delay: 0.5s"></div>
            <div class="vbar" style="animation-delay: 0.4s"></div>
        </div>
    </div>

    <!-- YouTube IFrame API SDK -->
    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        // 1. 3D Particle Space Warp VFX Canvas
        const canvas = document.getElementById('vfx-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.z = Math.random() * canvas.width;
                this.size = Math.random() * 2 + 1;
                this.color = Math.random() > 0.5 ? '#ff0055' : '#00f3ff';
            }
            update() {
                this.z -= 2.2;
                if (this.z <= 0) this.reset();
            }
            draw() {
                let x3d = (this.x - canvas.width / 2) * (canvas.width / this.z) + canvas.width / 2;
                let y3d = (this.y - canvas.height / 2) * (canvas.width / this.z) + canvas.height / 2;
                let s3d = this.size * (canvas.width / this.z);

                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(x3d, y3d, Math.max(0, s3d), 0, Math.PI * 2);
                ctx.fill();
            }
        }

        for (let i = 0; i < 200; i++) particles.push(new Particle());

        function animate3D() {
            ctx.fillStyle = 'rgba(5, 5, 8, 0.25)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate3D);
        }
        animate3D();

        // 2. YouTube API & Timeline Controller Engine
        const API_KEY = "AIzaSyBOH0b7auUI8BY_L7sAaTcCNqrVFXUFuVo";
        let ytPlayer;
        let updateTimer = null;

        function onYouTubeIframeAPIReady() {
            ytPlayer = new YT.Player('yt-player', {
                height: '0',
                width: '0',
                events: {
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerStateChange(event) {
            const btn = document.getElementById('playPauseBtn');
            if (event.data === YT.PlayerState.PLAYING) {
                btn.innerText = '⏸';
                startTimelineTracker();
            } else {
                btn.innerText = '▶';
                stopTimelineTracker();
            }
        }

        window.onload = () => {
            searchYouTube("Latest Punjabi Hits 2026");
        };

        function handleSearchKey(e) {
            if (e.key === 'Enter') {
                const query = e.target.value.trim();
                if (query) searchYouTube(query);
            }
        }

        async function searchYouTube(query) {
            const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=16&q=${encodeURIComponent(query)}&type=video&key=${API_KEY}`;
            try {
                const res = await fetch(url);
                const data = await res.json();
                if (data.items) renderGrid(data.items);
            } catch (err) {
                console.error(err);
            }
        }

        function renderGrid(items) {
            const grid = document.getElementById('trackGrid');
            grid.innerHTML = '';

            items.forEach(item => {
                const videoId = item.id.videoId;
                if (!videoId) return;
                const title = item.snippet.title;
                const channel = item.snippet.channelTitle;
                const thumb = item.snippet.thumbnails.medium.url;

                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <img src="${thumb}" alt="art">
                    <div class="card-title">${title}</div>
                    <div class="card-artist">${channel}</div>
                    <div class="card-actions">
                        <button class="btn-action btn-play" onclick="playTrack('${videoId}', \`${escapeQuotes(title)}\`, \`${escapeQuotes(channel)}\`, '${thumb}')">▶ PLAY</button>
                        <button class="btn-action btn-dl" onclick="downloadTrack('${videoId}')">⬇ MP3</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function playTrack(videoId, title, channel, thumb) {
            document.getElementById('playerTitle').innerText = title;
            document.getElementById('playerArtist').innerText = channel;
            document.getElementById('playerThumb').src = thumb;

            if (ytPlayer && ytPlayer.loadVideoById) {
                ytPlayer.loadVideoById(videoId);
                ytPlayer.playVideo();
            }
        }

        function togglePlayPause() {
            if (!ytPlayer) return;
            const state = ytPlayer.getPlayerState();
            if (state === YT.PlayerState.PLAYING) {
                ytPlayer.pauseVideo();
            } else {
                ytPlayer.playVideo();
            }
        }

        function stopMusic() {
            if (!ytPlayer) return;
            ytPlayer.stopVideo();
            document.getElementById('playPauseBtn').innerText = '▶';
            document.getElementById('currTime').innerText = "0:00";
            document.getElementById('seekBar').value = 0;
        }

        // Seeking (Music Aage-Piche Karna)
        function seekRelative(seconds) {
            if (!ytPlayer) return;
            const currentTime = ytPlayer.getCurrentTime();
            ytPlayer.seekTo(currentTime + seconds, true);
        }

        function onSeekChange(value) {
            if (!ytPlayer) return;
            const duration = ytPlayer.getDuration();
            const targetTime = (value / 100) * duration;
            ytPlayer.seekTo(targetTime, true);
        }

        function startTimelineTracker() {
            stopTimelineTracker();
            updateTimer = setInterval(() => {
                if (ytPlayer && ytPlayer.getCurrentTime && ytPlayer.getDuration) {
                    const curr = ytPlayer.getCurrentTime();
                    const dur = ytPlayer.getDuration();
                    if (dur > 0) {
                        const pct = (curr / dur) * 100;
                        document.getElementById('seekBar').value = pct;
                        document.getElementById('currTime').innerText = formatTime(curr);
                        document.getElementById('totalTime').innerText = formatTime(dur);
                    }
                }
            }, 500);
        }

        function stopTimelineTracker() {
            if (updateTimer) clearInterval(updateTimer);
        }

        function formatTime(sec) {
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        function downloadTrack(videoId) {
            window.open(`https://www.y2mate.com/youtube/${videoId}`, '_blank');
        }

        function escapeQuotes(str) {
            return str.replace(/'/g, "\\'").replace(/"/g, '&quot;');
        }
    </script>
</body>
</html>
